[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "vpnprobe"
version = "0.3.5"
description = "Unprivileged VPN and MTProto probing library and CLI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiohttp==3.14.2",
  "aiohttp-socks==0.11.0",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
  "types-psutil==7.2.2.20260518",
]

[project.scripts]
vpnprobe = "vpnprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vpnprobe"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["vpnprobe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=vpnprobe --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["vpnprobe"]
omit = ["src/vpnprobe/__main__.py"]
